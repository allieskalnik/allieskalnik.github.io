<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Allie Skalnik Portfolio</title>

    <style>
        /* Reset default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f7ff;
        }

        /* Work Section */
.work-section {
    margin-top: 60px;
}

.work-section h2 {
    font-size: 28px;
    margin-bottom: 25px;
    color: #111827;
}

/* Grid layout */
.work-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

/* Card */
.work-card {
    display: block;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: #111827;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.work-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.work-card h3 {
    padding: 15px;
    font-size: 18px;
    font-weight: 600;
}

/* Hover effect */
.work-card:hover {
    transform: translateY(-4px);
    box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
}

        /* Navbar */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            font-size: 16px;
            color: #374151;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* Main content */
        main {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        .box {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">Allie Skalnik</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <main>
        <div class="box">
            <h1>Allie Skalnik Portfolio</h1>
            <img src="images/IMG_4866.jpg" width="300" style="margin-top:20px;">
            <p>Science Writer</p>
        </div>
        <section class="work-section">
    <h2>My Work</h2>

    <div class="work-grid">

        <a href="https://missionlocal.org/2025/10/sf-hunters-point-shipyard-superfund-timeline/" class="work-card">
            <img src="images/article1.jpg" alt="Article 1">
            <h3>After nearly 30 years, is cleanup of the Hunters Point Shipyard almost, finally ending?</h3>
        </a>

        <a href="https://missionlocal.org/2025/08/oyster-reef-monitoring-bayview/" class="work-card">
            <img src="images/article2.jpg" alt="Article 2">
            <h3>Meet the man crawling across Bayview mudflats at 5 a.m. — for science</h3>
        </a>

    </div>
</section>
    </main>

</body>
</html>
