<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>About Me</title>

    <style>
        /* Reset default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f7ff;
        }

        /* Navbar */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            font-size: 16px;
            color: #374151;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* Main content */
        main {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        .box {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">Allie Skalnik</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <main>
        <div class="box">
            <h1>About Me</h1>
            <p>Hello world!</p>

            <img src="images/09403C8F-CD41-4C44-B685-CED16EF89EC8_4_5005_c.jpeg" width="300" style="margin-top:20px;">
        </div>
    </main>

</body>
</html>
